services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: two-factor-backend
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    networks:
      - two-factor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: two-factor-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - two-factor-network

  nginx:
    image: nginx:1.28-alpine
    container_name: two-factor-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - two-factor-network

  database:
    image: postgres:16-alpine
    container_name: two-factor-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: two_factor_auth
      POSTGRES_USER: two_factor_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U two_factor_user -d two_factor_auth
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - two-factor-network

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  two-factor-network:
    driver: bridge
